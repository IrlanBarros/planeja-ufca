<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Planeja UFCA" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Aplicado antes da interface e do CSS para evitar um primeiro quadro com o tema errado.
      (() => {
        let preference = 'system'
        try {
          const current = localStorage.getItem('planeja-ufca:theme')
          const saved = current ?? localStorage.getItem('projeta-ufca:theme') ?? localStorage.getItem('seu-horario-ufca:theme')
          if (saved === 'light' || saved === 'dark' || saved === 'system') {
            preference = saved
            if (current === null) {
              try { localStorage.setItem('planeja-ufca:theme', saved) } catch { /* A leitura ainda vale. */ }
            }
          }
        } catch { /* O acesso ao armazenamento pode estar bloqueado. */ }
        const prefersDark = typeof window.matchMedia === 'function'
          && window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme = preference === 'system' ? (prefersDark ? 'dark' : 'light') : preference
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
